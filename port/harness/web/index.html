<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Blur</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0b0b0d;color:#c8c8d0;font:13px/1.4 ui-monospace,Menlo,monospace}
  #wrap{display:flex;flex-direction:column;height:100%}
  #bar{padding:6px 12px;display:flex;gap:16px;align-items:center;background:#15151a;border-bottom:1px solid #26262e}
  #bar b{color:#fff} #status.ok{color:#7ddf8a} #status.bad{color:#ff8080}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  canvas:focus,canvas:focus-visible{outline:none}
  body.idle-cursor,body.idle-cursor canvas{cursor:none}
  canvas{max-width:100%;max-height:100%;aspect-ratio:16/9;background:#000;image-rendering:auto}
  body.hide-bar #bar{display:none} body.hide-log #log{display:none}
  #ui{position:relative;display:flex;gap:6px;align-items:flex-start;justify-content:flex-end;padding:4px 12px;background:#101014;border-bottom:1px solid #26262e}
  :fullscreen #ui{position:fixed;top:8px;right:12px;z-index:50;background:none;border:0;padding:0;opacity:.3;transition:opacity .2s} :fullscreen #ui:hover,:fullscreen #ui.open{opacity:1}
  #ui button{background:#1d1d24cc;color:#e6e6ee;border:1px solid #3a3a46;border-radius:6px;padding:5px 10px;font:12px/1.2 ui-monospace,Menlo,monospace;cursor:pointer} #ui button:hover{background:#2b2b36}
  #menu{display:none;position:absolute;top:100%;right:12px;z-index:60;min-width:190px;background:#15151ae6;border:1px solid #3a3a46;border-radius:8px;padding:8px 10px;flex-direction:column;gap:6px} #ui.open #menu{display:flex}
  #menu label{display:flex;gap:8px;align-items:center;cursor:pointer;color:#d8d8e2;white-space:nowrap} #menu .hint{color:#8a8a98;font-size:11px;margin-top:2px}
  :fullscreen #bar,:fullscreen #log{display:none} :fullscreen #stage{width:100vw;height:100vh} :fullscreen #c{width:100vw;height:100vh;max-width:none;max-height:none;aspect-ratio:auto;object-fit:cover}
  body.fit-contain:fullscreen #c,:fullscreen body.fit-contain #c{object-fit:contain} body.fit-fill #c{object-fit:fill}
  #log{max-height:22vh;overflow:auto;padding:6px 12px;background:#101014;border-top:1px solid #26262e;white-space:pre-wrap;color:#9a9aa8}
</style></head><body>
<div id="wrap">
  <div id="bar"><b id="brand">Blur on WebGL2</b><span id="status" class="bad">connecting…</span><span id="inputmode">input: keyboard</span><span id="fps"></span><span id="stats"></span></div>
  <div id="ui"><button id="fsbtn">⛶ Fullscreen</button><button id="menubtn">☰ Panels</button>
    <div id="menu"><label><input type="checkbox" autocomplete="off" id="cb-bar" checked> <span id="label-bar">Status bar</span></label><label><input type="checkbox" autocomplete="off" id="cb-log"> <span id="label-log">Log</span></label><label><input type="checkbox" autocomplete="off" id="cb-hud"> <span id="label-hud">Frame-time HUD</span> (F2)</label><div class="hint" id="fs-hint">F11 / double-click = fullscreen</div></div></div>
  <div id="stage"><canvas id="c" width="1280" height="720" tabindex="0"></canvas></div>
  <div id="log"></div>
</div>
<script src="locale.js"></script>
<script src="input.js"></script>
<script src="renderer.js"></script>
<script src="hcache.js"></script>
<script>(async () => {

  document.getElementById('label-bar').textContent = L.t('status_bar'); document.getElementById('label-log').textContent = L.t('log'); document.getElementById('label-hud').textContent = L.t('hud'); document.getElementById('fs-hint').textContent = L.t('fullscreen_hint');
  let canvas = document.getElementById('c'); const statusEl = document.getElementById('status'), logEl = document.getElementById('log');
  const log = (m) => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; };
  // #gpu=1: WebGPU renderer (renderer_gpu.js + the offline WGSL pack); any failure (no navigator.gpu / adapter / texture-compression-bc, init error, later device loss) falls back to WebGL2
